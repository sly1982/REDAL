<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Passeport Sécurité — SISST 2026</title>
<style>
  :root {
    --navy: #152a52;
    --navy-dark: #0d1c3d;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  html, body {
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--navy-dark);
  }
  #root {
    max-width: 460px;
    margin: 0 auto;
    min-height: 100vh;
    background: #fff;
    position: relative;
    box-shadow: 0 0 40px rgba(0,0,0,0.3);
  }
  .screen {
    position: relative;
    min-height: 100vh;
    overflow: hidden;
    padding-bottom: 50px;
  }
  .swoosh { position:absolute; border-radius:50%; pointer-events:none; }
  .logo-pill {
    position:absolute; top:14px; left:14px;
    background:#fff; border-radius:30px; padding:8px 16px;
    box-shadow:0 2px 8px rgba(0,0,0,0.15); z-index:5;
  }
  .logo-pill img { height:16px; display:block; }
  .veolia-pill {
    position:absolute; bottom:14px; right:14px;
    background:#fff; border-radius:30px; padding:8px 16px;
    box-shadow:0 2px 8px rgba(0,0,0,0.15); z-index:5;
  }
  .veolia-pill img { height:12px; display:block; }
  .stripe-bar {
    position:absolute; left:0; right:0; bottom:0; height:36px;
  }
  .badge {
    display:inline-block; color:#fff; font-weight:700;
    border-radius:30px; padding:6px 16px; font-size:11px; letter-spacing:1px;
  }
  h1.title { font-weight:800; line-height:1.05; color:var(--navy); }
  .bubble {
    background:#fff; border-radius:20px; padding:16px 18px; flex:1;
    box-shadow:0 3px 10px rgba(0,0,0,0.08);
  }
  .bubble p { font-style:italic; font-weight:700; color:var(--navy); font-size:15px; }
  .card {
    background:#fff; border-radius:18px; padding:18px; box-shadow:0 3px 10px rgba(0,0,0,0.08);
  }
  .quiz-opt {
    width:100%; text-align:left; display:flex; align-items:center; gap:10px;
    border-radius:12px; padding:10px 12px; border:1.5px solid #e4e4e4;
    background:#fff; font-size:14px; font-weight:600; color:#293b5f;
    cursor:pointer; margin-bottom:8px;
  }
  .quiz-opt.selected { border-color: var(--opt-color, var(--navy)); background: var(--opt-bg, #eef1f8); }
  input[type=text] {
    width:100%; border:1.5px solid #d7d7d7; border-radius:10px; padding:10px 12px; font-size:14px;
    font-family:inherit;
  }
  label.field-label { display:block; font-weight:700; color:var(--navy); font-size:12.5px; margin-bottom:5px; }
  button {
    font-family:inherit; cursor:pointer; border:none;
  }
  button:disabled { opacity:0.4; cursor:not-allowed; }
  .btn-primary {
    width:100%; border-radius:30px; padding:13px; font-weight:800; color:#fff; background:var(--navy);
    font-size:15px; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-gold {
    width:100%; border-radius:30px; padding:13px; font-weight:800; color:var(--navy); background:#ffc60b;
    font-size:15px;
  }
  .step-dots { display:flex; justify-content:center; gap:10px; padding-top:60px; position:relative; z-index:2;}
  .step-dot {
    width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:12px; border:none;
  }
  .gm-box {
    border-radius:18px; padding:16px; border:2px dashed var(--navy); background:rgba(255,255,255,0.85);
  }
  .done-box { border-radius:18px; padding:16px; background:var(--navy); color:#fff; }
  .link-btn {
    background:none; font-size:12px; font-weight:700; text-decoration:underline; display:inline-flex;
    align-items:center; gap:6px;
  }
  .modal-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center;
    padding:24px; z-index:50;
  }
  .modal-box { background:#fff; border-radius:18px; padding:22px; max-width:360px; width:100%; position:relative; }
  .stat-row { display:flex; justify-content:space-between; align-items:center; background:#f4f4f4; border-radius:12px; padding:12px 16px; margin-bottom:10px; }
  .config-warning {
    background:#fff3cd; color:#8a6d1a; font-size:11px; padding:8px 12px 8px 64px; border-radius:0 0 14px 14px;
    text-align:center; font-weight:600; position:relative; z-index:1;
  }
  .recap-item { display:flex; justify-content:space-between; align-items:center; border-radius:18px; padding:14px 16px;
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.25); margin-bottom:10px; }
</style>
</head>

function uid() { return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function emptyProgress() { return { 0: {}, 1: {}, 2: {} }; }

let state = {
  screen: "start",
  current: 0,
  participant: { id: "", name: "", site: "" },
  progress: emptyProgress(),
  answerChoice: null,
  fillText: "",
  gmName: "",
  pin: "",
  pinError: "",
  saving: false,
  showDash: false,
  dashLoading: false,
  dashStats: null
};

function loadLocal() {
  try {
    const raw = localStorage.getItem("veolia-passport");
    if (!raw) return;
    const data = JSON.parse(raw);
    state.participant = data.participant;
    state.progress = data.progress || emptyProgress();
    const nextIdx = [0, 1, 2].find((i) => !state.progress[i] || !state.progress[i].done);
    if (nextIdx === undefined) {
      state.screen = "recap";
    } else {
      state.current = nextIdx;
      state.screen = "atelier";
    }
  } catch (e) {}
}
function saveLocal() {
  localStorage.setItem("veolia-passport", JSON.stringify({ participant: state.participant, progress: state.progress }));
}

/* ============== APPEL API (Google Sheets via Apps Script) ============== */
function apiConfigured() {
  return CONFIG.API_URL && CONFIG.API_URL.indexOf("REPLACE_WITH") === -1;
}
async function sendToSheet(payload) {
  if (!apiConfigured()) return { status: "skipped" };
  try {
    await fetch(CONFIG.API_URL, { method: "POST", body: JSON.stringify(payload) });
    return { status: "ok" };
  } catch (e) {
    return { status: "error", message: String(e) };
  }
}
async function fetchStats() {
  if (!apiConfigured()) return { total: 0, completed: 0, notConfigured: true };
  try {
    const res = await fetch(CONFIG.API_URL, { method: "GET" });
    const data = await res.json();
    const rows = data.rows || [];
    const byParticipant = {};
    rows.forEach((r) => {
      const id = r.ParticipantID;
      if (!byParticipant[id]) byParticipant[id] = new Set();
      byParticipant[id].add(String(r.AtelierNum));
    });
    const total = Object.keys(byParticipant).length;
    const completed = Object.values(byParticipant).filter((s) => s.size >= 3).length;
    return { total, completed };
  } catch (e) {
    return { total: 0, completed: 0, error: String(e) };
  }
}

          return `<button class="quiz-opt ${selected ? 'selected' : ''}" data-answer="${i}" ${done ? 'disabled' : ''} style="--opt-color:${a.accentDark}; --opt-bg:${a.accent}22;">
            ${selected ? ICONS.checkCircle(a.accentDark) : ICONS.circle("#c7c7c7")} ${opt}
          </button>`;
        }).join("")}
        <label class="field-label" style="margin-top:12px;">${a.fillLabel}</label>
        <input type="text" id="fillInput" placeholder="${a.fillPlaceholder}" value="${state.fillText}" ${done ? 'disabled' : ''}>
      </div>
    </div>
    <div style="padding:0 24px; margin-top:20px; position:relative;">
      ${done ? `
        <div class="done-box">
          <p style="font-weight:800; display:flex; align-items:center; gap:8px; font-size:14px;">${ICONS.shield("#fff")} Étape validée !</p>
          <p style="opacity:0.8; font-size:12px; margin-top:4px;">Par ${state.progress[state.current].gmName || "Game Master"} · ${state.progress[state.current].date}</p>
          <button class="btn-gold" id="nextBtn" style="margin-top:12px;">${state.current < 2 ? "Étape suivante →" : "Voir mon récapitulatif →"}</button>
        </div>
      ` : `
        <div class="gm-box">
          <p style="font-weight:800; display:flex; align-items:center; gap:8px; color:var(--navy); font-size:13px; margin-bottom:12px;">${ICONS.lock("var(--navy)")} Validation Game Master</p>
          <input type="text" id="gmNameInput" placeholder="SLIMANE" value="${state.gmName}" style="margin-bottom:8px;">
          <input type="text" id="pinInput" placeholder="Code de validation" value="${state.pin}" style="margin-bottom:8px; letter-spacing:3px;" inputmode="numeric">
          ${state.pinError ? `<p style="color:#c0392b; font-size:12px; font-weight:600; margin-bottom:8px;">${state.pinError}</p>` : ""}
          <button class="btn-primary" id="validateBtn" ${state.saving || state.answerChoice === null ? "disabled" : ""}>Valider cette étape</button>
          ${state.answerChoice === null ? `<p style="font-size:11px; color:#7a7a7a; text-align:center; margin-top:8px;">Choisissez une réponse au quiz avant validation.</p>` : ""}
        </div>
      `}
    </div>
    ${renderVeoliaBadge()}
  </div>`;
}

function renderRecap() {
  const allDone = [0, 1, 2].every((i) => state.progress[i] && state.progress[i].done);
  return `
  <div class="screen" style="background:linear-gradient(165deg, #152a52 0%, #0d1c3d 100%);">
    <div class="swoosh" style="width:300px;height:300px;background:rgba(255,255,255,0.05);top:-110px;left:-110px;"></div>
    ${renderLogoBar()}
    <div style="padding:96px 24px 0; text-align:center; position:relative;">
      <p style="color:#ffc60b; font-weight:800; font-size:11px; letter-spacing:2px;">${allDone ? "MISSION ACCOMPLIE !" : "MISSION EN COURS"}</p>
      <h1 style="color:#fff; font-weight:800; font-size:22px; margin-top:8px;">Récapitulatif de<br>ma mission retour</h1>
      <p style="color:rgba(255,255,255,0.7); font-size:12px; margin-top:8px;">${state.participant.name} · ${state.participant.site}</p>
    </div>
    <div style="padding:24px 24px 0; position:relative;">
      ${ATELIERS.map((a, i) => {
        const p = state.progress[i];
        return `<div class="recap-item">
          <div>
            <p style="color:#fff; font-weight:700; font-size:13px;">${a.num} · ${a.title.join(" ")}</p>
            ${p && p.done ? `<p style="color:rgba(255,255,255,0.6); font-size:10.5px; margin-top:2px;">Validé par ${p.gmName || "Game Master"} · ${p.date}</p>` : ""}
          </div>
          ${p && p.done ? ICONS.checkCircle("#ffc60b") : ICONS.circle("rgba(255,255,255,0.4)")}
        </div>`;
      }).join("")}
    </div>
    <div style="padding:32px 24px 0; text-align:center; position:relative;">
      <img src="${MASCOT}" style="height:90px; opacity:${allDone ? 1 : 0.6};">
      <p style="color:#fff; font-weight:800; font-size:15px; margin-top:12px;">${allDone ? "MERCI D'AVOIR PARTICIPÉ !" : "Continuez votre parcours au Village Sécurité"}</p>
      <p style="color:rgba(255,255,255,0.7); font-size:12px; margin-top:6px; padding:0 16px;">Agir en sécurité, Agir maintenant — Rentrer sain et sauf, chaque jour.</p>
      <button class="link-btn" id="dashBtn2" style="color:rgba(255,255,255,0.7); margin-top:24px;">${ICONS.bar()} Statistiques (Game Master)</button>
    </div>
    <div class="stripe-bar" style="${stripeBar('#152a52', '#0d1c3d')}"></div>
    ${renderVeoliaBadge()}
  </div>`;
}

function renderDashboard() {
  const s = state.dashStats;
  return `
  <div class="modal-overlay" id="dashOverlay">
    <div class="modal-box">
      <button id="closeDash" style="position:absolute; top:14px; right:14px; background:none;">${ICONS.close()}</button>
      <p style="font-weight:800; color:var(--navy); display:flex; align-items:center; gap:8px; margin-bottom:16px;">${ICONS.bar()} Tableau de bord</p>
      ${state.dashLoading ? `<p style="font-size:13px; color:#888;">Chargement…</p>` : `
        ${s && s.notConfigured ? `<p style="font-size:12px; color:#8a6d1a; background:#fff3cd; padding:10px; border-radius:10px;">Backend non configuré (CONFIG.API_URL).</p>` : `
        <div class="stat-row"><span style="font-size:13px; font-weight:600; color:#555;">Passeports démarrés</span><span style="font-weight:800; font-size:18px; color:var(--navy);">${s ? s.total : 0}</span></div>
        <div class="stat-row"><span style="font-size:13px; font-weight:600; color:#555;">Missions complètes</span><span style="font-weight:800; font-size:18px; color:var(--navy);">${s ? s.completed : 0}</span></div>
        `}
      `}
    </div>
  </div>`;
}

/* ============== HANDLERS ============== */
function attachHandlers() {
  const nameInput = document.getElementById("nameInput");
  const siteInput = document.getElementById("siteInput");
  if (nameInput) nameInput.oninput = (e) => { state._nameInput = e.target.value; };
  if (siteInput) siteInput.oninput = (e) => { state._siteInput = e.target.value; };

  const startBtn = document.getElementById("startBtn");
  if (startBtn) startBtn.onclick = startMission;

  const dashBtn = document.getElementById("dashBtn") || document.getElementById("dashBtn2");
  if (dashBtn) dashBtn.onclick = openDashboard;

  const closeDash = document.getElementById("closeDash");
  if (closeDash) closeDash.onclick = () => { state.showDash = false; render(); };

  document.querySelectorAll("[data-jump]").forEach((btn) => {
    btn.onclick = () => {
      const i = parseInt(btn.getAttribute("data-jump"), 10);
      if ((state.progress[i] && state.progress[i].done) || i === state.current) {
        state.current = i;
        state.answerChoice = null; state.fillText = ""; state.gmName = ""; state.pin = ""; state.pinError = "";
        render();
      }
    };
  });

  document.querySelectorAll("[data-answer]").forEach((btn) => {
    btn.onclick = () => {
      state.answerChoice = parseInt(btn.getAttribute("data-answer"), 10);
      render();
    };
  });

  const fillInput = document.getElementById("fillInput");
  if (fillInput) fillInput.oninput = (e) => { state.fillText = e.target.value; };

  const gmNameInput = document.getElementById("gmNameInput");
  if (gmNameInput) gmNameInput.oninput = (e) => { state.gmName = e.target.value; };

  const pinInput = document.getElementById("pinInput");
  if (pinInput) pinInput.oninput = (e) => { state.pin = e.target.value; };

  const validateBtn = document.getElementById("validateBtn");
  if (validateBtn) validateBtn.onclick = submitValidation;

  const nextBtn = document.getElementById("nextBtn");
  if (nextBtn) nextBtn.onclick = goNext;
}

async function startMission() {
  const name = (state._nameInput || "").trim();
  if (!name) return;
  state.participant = { id: uid(), name: name, site: (state._siteInput || "").trim() };
  state.progress = emptyProgress();
  state.screen = "atelier";
  state.current = 0;
  saveLocal();
  render();
}

async function submitValidation() {
  const a = ATELIERS[state.current];
  if (state.pin.trim() !== a.pin) {
    state.pinError = "Code Game Master incorrect.";
    render();
    return;
  }
  state.pinError = "";
  state.saving = true;
  const dateStr = new Date().toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  state.progress[state.current] = {
    done: true,
    answer: state.answerChoice,
    fill: state.fillText,
    gmName: state.gmName.trim(),
    date: dateStr
  };
  saveLocal();
  await sendToSheet({
    participantId: state.participant.id,
    name: state.participant.name,
    site: state.participant.site,
    atelierNum: a.num,
    atelierName: a.title.join(" "),
    quizAnswer: a.quiz.options[state.answerChoice],
    freeText: state.fillText,
    gmName: state.gmName.trim(),
    validatedAt: dateStr
  });
  state.saving = false;
  render();
}

function goNext() {
  state.answerChoice = null; state.fillText = ""; state.gmName = ""; state.pin = ""; state.pinError = "";
  if (state.current < 2) state.current += 1;
  else state.screen = "recap";
  render();
}

async function openDashboard() {
  state.showDash = true;
  state.dashLoading = true;
  render();
  const stats = await fetchStats();
  state.dashStats = stats;
  state.dashLoading = false;
  render();
}

/* ============== INIT ============== */
loadLocal();
render();
</script>
</body>
</html>
